version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: essor-backend-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - CORS_ORIGIN=*
    volumes:
      - backend_data:/app/.data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: essor-frontend-spa
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  backend_data:
    driver: local
